<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGLE - Gestao de Leitos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script>
        if (!localStorage.getItem('sigem_sessao')) {
            window.location.href = 'index.html';
        }
    </script>

    <header class="topo">
        <div class="marca">
            <div class="logo-badge">
                <span class="logo-texto">SIGLE</span>
            </div>
            <div class="marca-texto">
                <h1>SIGLE</h1>
                <span>Sistema de Gestao de Leitos Hospitalares</span>
            </div>
        </div>
        <nav class="menu">
            <a href="portal.html">Portal</a>
            <span id="usuario-logado"></span>
        </nav>
    </header>

    <main>
        <div id="mensagem-area"></div>

        <!-- Cards de resumo -->
        <section class="cards" id="cards-resumo"></section>

        <section class="bloco">
            <h2>Cadastrar leito</h2>
            <form class="form-cadastro" id="form-leito">
                <div class="campo">
                    <label for="numero">Numero do leito</label>
                    <input type="text" id="numero" placeholder="Ex: 101-A" required>
                </div>
                <div class="campo">
                    <label for="setor">Setor</label>
                    <input type="text" id="setor" placeholder="Ex: UTI, Enfermaria" required>
                </div>
                <div class="form-acoes">
                    <button type="submit" class="btn-primario">Cadastrar leito</button>
                </div>
            </form>
        </section>

        <section class="bloco">
            <h2>Leitos cadastrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Numero</th>
                        <th>Setor</th>
                        <th>Status</th>
                        <th>Paciente</th>
                        <th>Acoes</th>
                    </tr>
                </thead>
                <tbody id="tabela-leitos"></tbody>
            </table>
        </section>
    </main>

    <footer class="rodape">
        SIGLE &mdash; Sistema de Gestao de Leitos Hospitalares &middot; Projeto academico
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/leitos.js"></script>
</body>
</html>
