<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGEM - Entrar</title>
    <script src="js/tema.js?v=5"></script>
    <script src="js/transicoes.js?v=5"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f1f4d">
    <link rel="apple-touch-icon" href="assets/img/icone-192.png">
    <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body class="pagina-abertura">

    <main class="abertura">
        <div class="abertura-card">
            <img src="assets/img/logo.png" alt="Logo SIGEM" class="abertura-logo">

            <p class="abertura-frase">
                Mais controle, seguranca e eficiencia no gerenciamento
                de medicamentos hospitalares.
            </p>

            <div id="mensagem-login"></div>

            <div class="abas-login" role="tablist">
                <button type="button" class="aba-login ativa" id="aba-entrar" role="tab">Entrar</button>
                <button type="button" class="aba-login" id="aba-criar" role="tab">Criar conta</button>
            </div>

            <!-- Entrar com e-mail e senha (conferidos no banco de dados) -->
            <form id="form-entrar" class="form-login">
                <input type="email" id="entrar-email" placeholder="E-mail" autocomplete="username" required>
                <input type="password" id="entrar-senha" placeholder="Senha" autocomplete="current-password" required>
                <label class="mostrar-senha"><input type="checkbox" data-alvo="entrar-senha"> Mostrar senha</label>
                <button type="submit" class="btn-primario btn-iniciar">Entrar</button>
            </form>

            <!-- Criar conta nova (a senha e guardada como hash, nunca em texto) -->
            <form id="form-criar" class="form-login" hidden>
                <input type="text" id="criar-nome" placeholder="Seu nome" autocomplete="name" required>
                <input type="email" id="criar-email" placeholder="E-mail" autocomplete="username" required>
                <input type="password" id="criar-senha" placeholder="Senha (mínimo 6 caracteres)" autocomplete="new-password" minlength="6" required>
                <label class="mostrar-senha"><input type="checkbox" data-alvo="criar-senha"> Mostrar senha</label>
                <label class="rotulo-perfil" for="criar-perfil">Seu perfil</label>
                <select id="criar-perfil">
                    <option value="farmaceutico">Farmaceutico</option>
                    <option value="enfermeiro">Enfermeiro</option>
                    <option value="gestor">Gestor</option>
                </select>
                <p class="descricao-perfil" id="descricao-perfil"></p>
                <button type="submit" class="btn-primario btn-iniciar">Criar conta</button>
            </form>

            <button type="button" class="link-visitante" id="btn-visitante">Entrar como visitante (somente leitura)</button>
        </div>
    </main>

    <footer class="rodape rodape-abertura">
        SIGEM &mdash; Sistema de Gestao de Medicamentos Hospitalares &middot; Projeto academico
    </footer>

    <script src="js/auth.js?v=5"></script>
    <script src="js/api.js?v=5"></script>
    <script src="js/login.js?v=5"></script>
    <script src="js/instalar.js?v=5"></script>
</body>
</html>
