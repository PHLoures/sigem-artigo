<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Hospitalar - Entrar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-abertura">

    <main class="abertura">
        <div class="abertura-card">
            <img src="assets/img/logo.png" alt="Logo" class="abertura-logo">

            <h2 class="abertura-titulo">Portal Hospitalar</h2>
            <p class="abertura-frase">
                Sistemas de apoio a gestao hospitalar: medicamentos,
                leitos, escalas e fila de cirurgias.
            </p>

            <div id="mensagem-login"></div>

            <!-- Login com nome, guardado como "convidado" na sessao.
                 Um login com Google pode ser adicionado depois aqui,
                 sem precisar mudar o resto do sistema (veja js/auth.js). -->
            <form id="form-login" class="form-login">
                <input
                    type="text"
                    id="nome-usuario"
                    placeholder="Seu nome"
                    autocomplete="name"
                    required
                >
                <button type="submit" class="btn-primario btn-iniciar">Entrar como Convidado</button>
            </form>
        </div>
    </main>

    <footer class="rodape rodape-abertura">
        Portal Hospitalar &middot; Projeto academico
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
