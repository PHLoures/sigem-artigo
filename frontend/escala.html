<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGEP - Escala de Profissionais</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script>
        if (!localStorage.getItem('sigem_sessao')) {
            window.location.href = 'index.html';
        }
    </script>

    <header class="topo">
        <div class="marca">
            <div class="logo-badge">
                <span class="logo-texto">SIGEP</span>
            </div>
            <div class="marca-texto">
                <h1>SIGEP</h1>
                <span>Sistema de Gestao de Escalas de Profissionais</span>
            </div>
        </div>
        <nav class="menu">
            <a href="portal.html">Portal</a>
            <span id="usuario-logado"></span>
        </nav>
    </header>

    <main>
        <div id="mensagem-area"></div>

        <section class="cards" id="cards-resumo"></section>

        <section class="bloco">
            <h2>Cadastrar profissional</h2>
            <form class="form-cadastro" id="form-profissional">
                <div class="campo">
                    <label for="prof-nome">Nome</label>
                    <input type="text" id="prof-nome" required>
                </div>
                <div class="campo">
                    <label for="prof-cargo">Cargo</label>
                    <select id="prof-cargo" required>
                        <option value="Medico">Medico</option>
                        <option value="Enfermeiro">Enfermeiro</option>
                        <option value="Tecnico">Tecnico</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="prof-setor">Setor</label>
                    <input type="text" id="prof-setor" placeholder="Ex: UTI, Enfermaria" required>
                </div>
                <div class="form-acoes">
                    <button type="submit" class="btn-primario">Cadastrar profissional</button>
                </div>
            </form>
        </section>

        <section class="bloco">
            <h2>Registrar escala (turno de trabalho)</h2>
            <form class="form-cadastro" id="form-escala">
                <div class="campo">
                    <label for="escala-profissional">Profissional</label>
                    <select id="escala-profissional" required></select>
                </div>
                <div class="campo">
                    <label for="escala-data">Data</label>
                    <input type="date" id="escala-data" required>
                </div>
                <div class="campo">
                    <label for="escala-turno">Turno</label>
                    <select id="escala-turno" required>
                        <option value="MANHA">Manha</option>
                        <option value="TARDE">Tarde</option>
                        <option value="NOITE">Noite</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="escala-setor">Setor</label>
                    <input type="text" id="escala-setor" placeholder="Ex: UTI, Enfermaria" required>
                </div>
                <div class="form-acoes">
                    <button type="submit" class="btn-primario">Registrar escala</button>
                </div>
            </form>
        </section>

        <section class="bloco">
            <h2>Escalas registradas</h2>
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Turno</th>
                        <th>Profissional</th>
                        <th>Cargo</th>
                        <th>Setor</th>
                        <th>Acoes</th>
                    </tr>
                </thead>
                <tbody id="tabela-escalas"></tbody>
            </table>
        </section>
    </main>

    <footer class="rodape">
        SIGEP &mdash; Sistema de Gestao de Escalas de Profissionais &middot; Projeto academico
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/escala.js"></script>
</body>
</html>
